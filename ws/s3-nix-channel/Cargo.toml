[package]
authors = ["Cyberus Technology GmbH"]
name = "s3-nix-channel"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "s3-nix-channel"

[[bin]]
name = "s3-nix-channel-upload"

[dependencies]
anyhow = { workspace = true }
arc-swap = "1.9.2"
axum = { workspace = true, features = ["http1", "http2", "macros", "tokio", "tracing"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "help", "std", "usage"] }
sd-notify = { version = "0.5.0", default-features = false }
sea-orm = { workspace = true, features = ["runtime-tokio", "sqlx-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "tracing"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

migration = { path = "../migration" }
entity = { path = "../entity" }
storage = { path = "../storage" }
